<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Design Studio architecture and authority boundary</title>
  <desc id="desc">Lazy CAD and EDA routes edit versioned EML CAD version 2 and EDA version 1 documents. Pure validation and engineering checks feed bounded mesh and OCCT workers. Open-format browser adapters remain local. Native file and process authority crosses PlatformBridge into typed Tauri commands, which alone may invoke separately installed KiCad and ngspice tools.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17324d"/>
    </marker>
    <style>
      .title { font: 700 26px system-ui, sans-serif; fill: #102a43; }
      .zone { font: 700 17px system-ui, sans-serif; fill: #102a43; letter-spacing: 0.04em; }
      .label { font: 700 15px system-ui, sans-serif; fill: #102a43; }
      .detail { font: 500 13px system-ui, sans-serif; fill: #243b53; }
      .browser { fill: #e6f6ff; stroke: #0967a1; stroke-width: 2; }
      .worker { fill: #f0f7ff; stroke: #245b9e; stroke-width: 2; }
      .gate { fill: #fff3bf; stroke: #9c6500; stroke-width: 3; }
      .native { fill: #e8f8ef; stroke: #18794e; stroke-width: 2; }
      .external { fill: #f4efff; stroke: #6b46a5; stroke-width: 2; }
      .flow { fill: none; stroke: #17324d; stroke-width: 2.5; marker-end: url(#arrow); }
      .boundary { fill: #fffaf0; stroke: #9c6500; stroke-width: 2; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>
  <text class="title" x="40" y="48">Engineering Design Studio architecture and authority boundary</text>

  <rect class="boundary" x="32" y="76" width="815" height="508" rx="18"/>
  <text class="zone" x="56" y="108">BROWSER AND LOCAL DOCUMENT AUTHORITY</text>

  <rect class="browser" x="70" y="142" width="250" height="78" rx="12"/>
  <text class="label" x="195" y="174" text-anchor="middle">Lazy CAD and EDA routes</text>
  <text class="detail" x="195" y="198" text-anchor="middle">User-initiated local editing</text>

  <rect class="browser" x="395" y="142" width="280" height="78" rx="12"/>
  <text class="label" x="535" y="174" text-anchor="middle">EML CAD v2 and EDA v1</text>
  <text class="detail" x="535" y="198" text-anchor="middle">Versioned editable documents</text>

  <rect class="browser" x="395" y="276" width="280" height="86" rx="12"/>
  <text class="label" x="535" y="307" text-anchor="middle">Pure domain modules</text>
  <text class="detail" x="535" y="330" text-anchor="middle">Validation, history, connectivity,</text>
  <text class="detail" x="535" y="349" text-anchor="middle">ERC and DRC</text>

  <rect class="worker" x="70" y="424" width="250" height="92" rx="12"/>
  <text class="label" x="195" y="455" text-anchor="middle">Bounded mesh worker</text>
  <text class="detail" x="195" y="478" text-anchor="middle">STL and 3MF reference meshes</text>
  <text class="detail" x="195" y="497" text-anchor="middle">Three.js rendering</text>

  <rect class="worker" x="395" y="424" width="280" height="92" rx="12"/>
  <text class="label" x="535" y="455" text-anchor="middle">One terminable OCCT worker</text>
  <text class="detail" x="535" y="478" text-anchor="middle">One replicad_single.wasm payload</text>
  <text class="detail" x="535" y="497" text-anchor="middle">Exact modelling isolation</text>

  <rect class="browser" x="705" y="276" width="112" height="148" rx="12"/>
  <text class="label" x="761" y="306" text-anchor="middle">Open-format</text>
  <text class="label" x="761" y="326" text-anchor="middle">adapters</text>
  <text class="detail" x="761" y="355" text-anchor="middle">STL</text>
  <text class="detail" x="761" y="375" text-anchor="middle">3MF</text>
  <text class="detail" x="761" y="395" text-anchor="middle">STEP</text>
  <text class="detail" x="761" y="415" text-anchor="middle">KiCad subset</text>

  <rect class="gate" x="705" y="142" width="112" height="78" rx="12"/>
  <text class="label" x="761" y="174" text-anchor="middle">PlatformBridge</text>
  <text class="detail" x="761" y="198" text-anchor="middle">Explicit gate</text>

  <line class="flow" x1="320" y1="181" x2="395" y2="181"/>
  <line class="flow" x1="535" y1="220" x2="535" y2="276"/>
  <path class="flow" d="M 453 362 L 453 393 L 320 393 L 320 424"/>
  <line class="flow" x1="535" y1="362" x2="535" y2="424"/>
  <line class="flow" x1="675" y1="319" x2="705" y2="319"/>
  <path class="flow" d="M 675 181 L 705 181"/>

  <line x1="866" y1="76" x2="866" y2="584" stroke="#9c6500" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="zone" x="886" y="108">NATIVE AUTHORITY</text>
  <text class="detail" x="886" y="130">No generic shell or path authority</text>

  <rect class="native" x="900" y="170" width="250" height="112" rx="12"/>
  <text class="label" x="1025" y="204" text-anchor="middle">Typed Tauri authority</text>
  <text class="detail" x="1025" y="228" text-anchor="middle">Exact tool IDs, fixed arguments,</text>
  <text class="detail" x="1025" y="248" text-anchor="middle">containment, limits and cancellation</text>

  <rect class="external" x="900" y="390" width="250" height="112" rx="12"/>
  <text class="label" x="1025" y="424" text-anchor="middle">Separately installed tools</text>
  <text class="detail" x="1025" y="449" text-anchor="middle">KiCad and ngspice</text>
  <text class="detail" x="1025" y="473" text-anchor="middle">Never bundled or auto-installed</text>

  <path class="flow" d="M 817 181 L 858 181 L 858 226 L 900 226"/>
  <line class="flow" x1="1025" y1="282" x2="1025" y2="390"/>
  <text class="detail" x="1025" y="328" text-anchor="middle">Typed, bounded invocation</text>
  <text class="detail" x="1025" y="350" text-anchor="middle">only after desktop authority</text>

  <text class="detail" x="56" y="566">Browser import and download do not grant native file or process authority.</text>
</svg>
